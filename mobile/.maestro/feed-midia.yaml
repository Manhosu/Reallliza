# Carrossel, vídeo e botão de ação no aplicativo do técnico.
#
# Complementa feed.yaml, que cobre o caminho básico. Aqui o alvo é a mídia:
# deslizar o carrossel, deixar o vídeo correr além dos quartis, e acionar o
# botão da publicação — os três geram evento de métrica, e é isso que
# interessa validar.
#
#   maestro test .maestro/feed-midia.yaml
appId: com.reallliza.app
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow

# ---- Entrar ----
# Os campos são mirados pela DICA, não pelo rótulo: tocar no rótulo não dá
# foco ao campo. Tempos generosos porque no emulador com GPU por software a
# primeira tela leva de 1m30s a mais de 4 minutos.
- extendedWaitUntil:
    visible: "seu@email.com"
    timeout: 480000
- tapOn: "seu@email.com"
- inputText: "maestro.qa@reallliza.com.br"
- hideKeyboard
- tapOn: "Sua senha"
- inputText: "MaestroQa-16ago!"
- hideKeyboard
- tapOn: "Entrar"

# ---- Termos, só no primeiro acesso ----
# O aceite fica gravado no servidor, então `clearState` não o traz de volta:
# a tela aparece uma vez por conta e some para sempre. A espera aceita as
# duas telas possíveis (o texto é tratado como expressão regular) e o bloco
# de aceite só roda se ela realmente estiver ali.
- extendedWaitUntil:
    visible: "Termos de Uso|Passo a passo da instalacao"
    timeout: 480000
- runFlow:
    when:
      visible: "Termos de Uso"
    commands:
      - tapOn: "Li e aceito os Termos de Uso e Politica de Privacidade"
      - tapOn: "Autorizo a coleta de dados de localizacao durante o uso do app"
      - tapOn: "Autorizo o uso das imagens capturadas durante os servicos"
      - tapOn: "Aceitar e Continuar"

# ---- A publicação com mídia ----
- extendedWaitUntil:
    visible: "Passo a passo da instalacao"
    timeout: 480000
- takeScreenshot: 01-carrossel-slide-1

# O contador do carrossel confirma quantos itens existem.
- assertVisible: "1/4"

# ---- Deslizar o carrossel ----
# Cada deslize gera um evento de avanço, contado uma vez por slide.
- swipe:
    start: "80%, 35%"
    end: "15%, 35%"
- assertVisible: "2/4"
- takeScreenshot: 02-carrossel-slide-2

- swipe:
    start: "80%, 35%"
    end: "15%, 35%"
- assertVisible: "3/4"
- takeScreenshot: 03-carrossel-slide-3

# ---- Vídeo, no quarto item ----
- swipe:
    start: "80%, 35%"
    end: "15%, 35%"
- assertVisible: "4/4"
- takeScreenshot: 04-video

# Não toca no vídeo: ele começa sozinho, mudo, quando o slide fica visível.
# Um toque aqui abriria os controles nativos e poderia pausar a reprodução no
# meio da medição. O vídeo tem 8 segundos; 14s de espera cobre os 100% com
# folga para o carregamento pela rede.
- waitForAnimationToEnd:
    timeout: 14000
- takeScreenshot: 05-video-tocando

# O botão de som confirma que o player está montado com autoplay mudo — é ele
# que devolve o áudio, porque os controles nativos do Android não têm volume.
- assertVisible: "Som"

# ---- Botão de ação ----
# Gera evento de clique, que alimenta a taxa de clique da campanha.
- scrollUntilVisible:
    element:
      text: "Baixar catalogo"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 06-botao-de-acao
- tapOn: "Baixar catalogo"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 07-apos-o-botao
